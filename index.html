<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8"/>
        <meta name="viewport" content="width=device-width">
        <link rel="stylesheet" type="text/css" href="styles.css">
        <script src="script.js" defer></script>
        <title>Library</title>
    </head>
    <body>
        <!-- <div class="triangle">a</div> -->
        <header class="header">
            <h1>LIBRARY</h1>
        </header>
        <div class="division">
            <div class="add-book">
                <form action="example.com/path" method="post">
                    <h2>Add book?</h2>
                    <div class="form-text-wrapper">
                        <label for="book-title">Book Title: </label>
                        <input type="text" class="input-text" id="book-title" for="book-title">
                    </div>
                    <div class="form-text-wrapper">
                        <label for="book-author">Book Author: </label>
                        <input type="text" class="input-text" id="book-author" for="book-author">
                    </div>
                    <div class="form-text-wrapper">
                        <label for="book-language">Language:</label>
                        <input type="text" class="input-text" id="book-language" for="book-language">
                    </div>
                    <div class="form-text-wrapper">
                        <label for="book-pages">Pages:</label>
                        <input type="text" class="input-text" id="book-pages" for="book-pages">
                    </div>
                    <div class="form-text-wrapper">
                        <label for="book-format">Format:</label>
                        <input type="text" class="input-text" id="book-format" for="book-format">
                    </div>
                    <fieldset>
                        <legend>Did you read it?</legend>
                        <div class="radio-wrapper">
                            <label for="book-read-no">no</label>
                            <input type="radio" class="input-radio" id="book-read-no" name="read" value="no" checked>
                        </div>
                        <div class="radio-wrapper">
                            <label for="book-read-yes">yes</label>
                            <input type="radio" class="input-radio" id="book-read-yes" name="read" value="yes">
                        </div>
                    </fieldset>
                    <div class="button-wrapper">
                        <button class="add-button">
                            Add
                        </button>
                    </div>
                </form>

            </div>
            <main class="library">
            <div class="card">
            <h2>
                The Lord of The Rings
                </h2>
                <p>Author: Pedro Hernandez Suarez Pino Fino  </p>
                <p>Language: English</p>
                <p>Pages: 320</p>
                <p>Format: Kindle</p>
                <p>Currency: USD</p>
                <p>Price: 25</p>
                <p>Read: true</p>
                <p>Book Id: 0d916173-00c3-47b0-b39c-f7e42753e278</p>
            </div>
            </main>
        </div>
    </body>
</html>
